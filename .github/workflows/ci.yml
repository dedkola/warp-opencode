name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Fetch verified Cloudflare helper for offline configuration regression
        run: |
          verified_helper_path="$(scripts/fetch-cloudflared.sh)"
          printf 'WARP_GO_CLOUDFLARED_PATH=%s\n' "$verified_helper_path" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Package macOS app with verified helper
        run: scripts/build-app.sh
      - name: Upload locally signed build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Warp-OpenCode-Bridge-macOS
          path: build/Warp-OpenCode-Bridge-*.zip
          if-no-files-found: error
          retention-days: 7
